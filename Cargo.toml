[workspace]
  resolver = "3"
  members = [
      "crates/core",
      "crates/derive",
  ]

  [workspace.package]
    edition = "2024"
    rust-version = "1.91.1"

    # name = "chronobot"
    version = "0.1.0"
    description = "A program for running games of chronomutants in various settings."

    license = "MIT"
    authors = [ "Maxine Zick <maxine@pnk.dev>" ]
    repository = "https://github.com/MaxTheMooshroom/chronobot"

  [workspace.dependencies]
    chrono-derive.path = "crates/derive"
    chronobot.path = "crates/core"

    anyhow = "1.0.102"
    clap = { version = "4.6.1", features = ["derive"] }
    futures = "0.3.32"
    serenity = { version = "0.12.5", features = ["chrono", "client"] }

    # dev dependencies
    criterion = "0.8.2"

